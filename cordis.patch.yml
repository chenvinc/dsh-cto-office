# CTO 办公室模式：一名 CTO 带六个岗位的 agent 预设集合。
#
# 第一段按 id 覆盖 base 里已有的 `agent-team` 行，把这个 profile 的团队任务板
# 默认打开（会话菜单里仍可逐会话关闭）。后面七段各声明一个 agent preset：
# 根是 cto-office，六个岗位是它派工时可选的子代理预设。
#
# 岗位的工具边界是真的：只读岗的 tool-fs 不挂 write/edit，写文件时工具根本不存在。
# 每个预设自己挂 skill-filesystem，指向本包的 skills/ 目录。

- id: agent-team
  config:
    maxTasks: 256
    defaultEnabled: true

- insert:
    # ── CTO（根）──────────────────────────────────────────────────────────
    - id: preset-cto-office
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cto-office
        name: CTO 办公室
        description: 你当 CTO：接需求、拆卡、派工给六个岗位、验结果、带证据汇报。不亲自写实现。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 CTO 办公室的 CTO，带一支六人团队：架构师、工程师、评审、QA、UI/UX 设计、业务。
                你不写实现。你的产出是决定、任务卡、和带证据的结论。
                接活先加载 skill cto-office：办公室章程（分工、六步、铁律、卡格式、派工模板）。
                派工用 subagent 的 agent_preset；子代理看不到你的对话，卡的内容必须写进 prompt。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js |
                  (() => {
                    const fs = process.getBuiltinModule('node:fs');
                    const path = process.getBuiltinModule('node:path');
                    const url = process.getBuiltinModule('node:url');
                    const { createRequire } = process.getBuiltinModule('node:module');
                    const self = '@chy/dsh-cto-office';
                    const hasSkills = dir => typeof dir === 'string' && fs.existsSync(path.join(dir, 'cto-office', 'SKILL.md'));
                    const candidates = [];
                    try { candidates.push(url.fileURLToPath(new URL('skills', baseUrl))); } catch {}
                    try { candidates.push(path.join(url.fileURLToPath(new URL('.', baseUrl)), 'node_modules', self, 'skills')); } catch {}
                    try { candidates.push(path.join(path.dirname(createRequire(baseUrl).resolve(self + '/package.json')), 'skills')); } catch {}
                    try { const home = process.env.DSH_HOME; for (const profile of fs.readdirSync(path.join(home, 'profiles'))) candidates.push(path.join(home, 'profiles', profile, 'node_modules', self, 'skills')); } catch {}
                    return candidates.find(hasSkills) ?? candidates[0];
                  })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 只有按岗位的派工：没有 fork（继承 CTO 的全量工具）与 workflow
          # （没有角色槽位），办公室里的每个代理都必须有一个具名岗位。
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  agentPreset: cto-builder
                  allowedAgentPresets:
                    - cto-architect
                    - cto-builder
                    - cto-reviewer
                    - cto-qa
                    - cto-ux
                    - cto-product
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'

    # ── 架构师 ────────────────────────────────────────────────────────────
