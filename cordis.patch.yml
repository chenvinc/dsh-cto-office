                    const { createRequire } = process.getBuiltinModule('node:module');
                    const self = '@swiper1881/dsh-cto-office';
                    const hasSkills = dir => typeof dir === 'string' && fs.existsSync(path.join(dir, 'cto-office', 'SKILL.md'));
                    const candidates = [];
