                    try { candidates.push(path.join(url.fileURLToPath(new URL('.', baseUrl)), 'node_modules', self, 'skills')); } catch {}
                    try { candidates.push(path.join(path.dirname(createRequire(baseUrl).resolve(self + '/package.json')), 'skills')); } catch {}
                    try { const home = process.env.DSH_HOME; for (const profile of fs.readdirSync(path.join(home, 'profiles'))) candidates.push(path.join(home, 'profiles', profile, 'node_modules', self, 'skills')); } catch {}
                    return candidates.find(hasSkills) ?? candidates[0];
                  })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

